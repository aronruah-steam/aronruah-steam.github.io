<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ① 改成這個系統的名稱 -->
  <title>專題研究學習系統｜RUAH科學探究教學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    /* 與 RUAH 首頁相同的配色 */
    :root { --ink:#0C2440; --blue:#12355B; --paper:#EAF1F5; --yellow:#F2B705; --text:#18293A; --muted:#566778; --line:#C3D2DD; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--text); line-height:1.8; background:#fff; }
    header { background:var(--ink); color:#F4F8FB; padding:1.6rem clamp(1rem,4vw,2.5rem); }
    header a { color:#C9DBEA; font-size:.9rem; }
    header h1 { margin:.4rem 0 0; font-family:"Noto Serif TC",serif; font-weight:900; letter-spacing:.08em; font-size:clamp(1.6rem,4vw,2.4rem); }
    header p { margin:.3rem 0 0; color:#C9DBEA; }
    .layout { display:grid; grid-template-columns:240px 1fr; max-width:1160px; margin:0 auto; }
    nav { padding:1.5rem 1rem; border-right:1px solid var(--line); position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto; }
    nav ol { margin:0; padding-left:1.4rem; }
    nav a { color:var(--blue); text-decoration:none; display:block; padding:.25rem 0; }
    nav a:hover { text-decoration:underline; }
    main { padding:1.5rem clamp(1rem,4vw,3rem) 4rem; max-width:48rem; }
    h2 { font-family:"Noto Serif TC",serif; font-weight:900; letter-spacing:.06em; border-left:6px solid var(--yellow); padding-left:.8rem; margin-top:2.8rem; }
    .task { background:var(--paper); border-radius:8px; padding:1rem 1.2rem; }
    .task strong { color:var(--blue); }
    footer { text-align:center; padding:2rem; color:var(--muted); border-top:1px solid var(--line); font-size:.9rem; }
    :focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
    @media (max-width:760px) { .layout { grid-template-columns:1fr; } nav { position:static; border-right:0; border-bottom:1px solid var(--line); max-height:none; } }
  </style>
</head>
<body>
  <header>
    <!-- ② 把網址改成你的 RUAH 首頁 -->
    <a href="https://YOUR-ACCOUNT.github.io/">← 回到 RUAH科學探究教學首頁</a>
    <h1>專題研究學習系統</h1>
    <p>一句話說明這個系統要帶學生學會什麼。</p>
  </header>

  <div class="layout">
    <!-- ③ 單元目錄：新增單元時，這裡和下方 main 各加一段，id 要對應 -->
    <nav aria-label="單元目錄">
      <ol>
        <li><a href="#unit1">單元一：找到研究問題</a></li>
        <li><a href="#unit2">單元二：撰寫研究計畫</a></li>
        <li><a href="#unit3">單元三：收集與分析資料</a></li>
      </ol>
    </nav>

    <main>
      <section id="unit1">
        <h2>單元一：找到研究問題</h2>
        <p>在這裡放單元說明、圖片或影片。</p>
        <div class="task"><strong>任務：</strong>在這裡寫學生要完成的練習。</div>
      </section>

      <section id="unit2">
        <h2>單元二：撰寫研究計畫</h2>
        <p>單元內容……</p>
      </section>

      <section id="unit3">
        <h2>單元三：收集與分析資料</h2>
        <p>單元內容……</p>
        <!-- 放圖片：把圖片上傳到同一個 repo 的 images 資料夾，再寫 -->
        <!-- <img src="images/example.jpg" alt="圖片說明" style="max-width:100%"> -->
        <!-- 嵌入 YouTube：在 YouTube 影片按「分享 → 嵌入」，把那段程式碼貼在這裡 -->
      </section>
    </main>
  </div>

  <footer>RUAH科學探究教學</footer>
</body>
</html>
